<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .box{
        height: 200px;
        width: 200px;
        background-color: teal;

        animation-name: ani1;
        animation-duration: 4s;
        animation-iteration-count: infinite;
    }
    @keyframes ani1{
        from{
            height: 0px;
            width: 0;
        }
        to{
            height: 400px;
            width: 400px;
            background-color: red;
            border-radius: 50%;
            border: 10px dotted darkblue;
        }
    }
</style>
<body>

    <div class="box">

    </div>

    
</body>
</html>
