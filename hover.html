<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .box{
        height: 200px;
        width: 200px;
        background-color: red;


        transition: 1s;
    }
    .box:hover{
        height: 400px;
        width: 400px;
        border-radius: 50%;
        background-color: blue;
        border: 10px dotted yellow;

        margin: 100px;
        background-image: url('https://media.licdn.com/dms/image/v2/D4D03AQHkULwzSw4h5w/profile-displayphoto-scale_200_200/B4DZvqsbyVHgAY-/0/1769169076250?e=2147483647&v=beta&t=8_0txsZKVVElqwFFKr50xZmsvl865-BVx0IXAuEP88M');
        background-size: cover;

        cursor: zoom-in;


        transition: 3s;
    }
</style>

<body>
    
    <!-- hover : mouse effect -->


    <div class="box"></div>



</body>
</html>
