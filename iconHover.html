<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<style>
    *{
        margin: 0;
        padding: 0;
    }
    .navbar{
        height: 100px;
        width: 100%;
        background-color: green;

        display: flex;
        justify-content: center;
        align-items: center;
        gap: 30px;
    }
    .round{
        height: 70px;
        width: 70px;
        background-color: white;
        border-radius: 50%;
        text-align: center;
        line-height: 70px;
    }
    .round i{
        font-size: 22px;
    }
    .round i:hover{
        font-size: 35px;
        transition: 0.5s;
    }
    .fa-instagram:hover{
        color: pink;
    }
    .fa-linkedin:hover{
        color: blue;
    }
    .fa-twitter:hover{
        color: skyblue;
    }
    .fa-youtube:hover{
        color: red;
    }
    .fa-facebook-f:hover{
        color: blue;
    }
</style>
<body>
    
    <div class="navbar">
        <div class="round"><i class="fa-brands fa-instagram"></i></div>
        <div class="round"><i class="fa-brands fa-linkedin"></i></div>
        <div class="round"><i class="fa-brands fa-twitter"></i></div>
        <div class="round"><i class="fa-brands fa-github"></i></div>
        <div class="round"><i class="fa-brands fa-youtube"></i></div>
        <div class="round"><i class="fa-brands fa-facebook-f"></i></div>
    </div>



</body>
</html>
